<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Побег от Мательского</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--ink:#0d1230;--gold:#ffc83d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);overscroll-behavior:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}#gl,#c{z-index:0}#c{pointer-events:none}
.hud{position:fixed;top:env(safe-area-inset-top,0);left:0;right:0;display:flex;justify-content:space-between;padding:12px 16px;pointer-events:none;font-weight:900;font-size:22px;text-shadow:0 2px 0 rgba(0,0,0,.45)}
.hud small{display:block;font-size:12px;font-weight:700;opacity:.85}
.hud .r{text-align:right}
#bons{position:fixed;top:calc(env(safe-area-inset-top,0) + 90px);left:16px;display:flex;gap:6px;flex-wrap:wrap;font-weight:800;font-size:14px;pointer-events:none}
#bons span{background:rgba(0,0,0,.45);border-radius:12px;padding:4px 9px}
#mpbar{position:fixed;top:calc(env(safe-area-inset-top,0) + 60px);left:50%;transform:translateX(-50%);font-size:12px;font-weight:800;background:rgba(0,0,0,.45);border-radius:10px;padding:5px 10px;pointer-events:none;min-width:110px}#mpbar .me{color:#ffd23f}input{font-family:inherit}
#bSnd{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0) + 62px);width:40px;height:40px;border-radius:20px;background:rgba(0,0,0,.4);font-size:18px;padding:0;box-shadow:none;color:#fff}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0) + 3vh) 24px 24px;text-align:center}
#menu{display:block;padding:0;background:linear-gradient(#0d1230cc,transparent 20%,transparent 68%,#0d1230dd);text-align:left}
#menu>*{position:absolute}
.mtop{top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:center}
.cur{background:#24324f;border:2px solid #3b4d78;border-radius:13px;padding:3px 5px 3px 10px;font-weight:900;font-size:16px;display:flex;gap:8px;align-items:center}
.plus{background:#3bb94a;border-radius:9px;padding:0 8px;font-size:18px;line-height:22px}
.gear{width:38px;height:38px;border-radius:19px;padding:0;font-size:20px;background:rgba(0,0,0,.35);box-shadow:none}
.gtitle{top:calc(env(safe-area-inset-top,0px) + 29vh);left:0;right:0;text-align:center;font-size:42px;font-weight:900;font-style:italic;line-height:.9;color:#b6ff3b;text-shadow:0 4px 0 #3c6b00,0 8px 14px rgba(0,0,0,.5);transform:rotate(-4deg)}
.gtitle em{display:block;font-size:21px;color:#fff;text-shadow:0 3px 0 #c4202a;margin-top:6px}
.mleft{left:12px;top:calc(env(safe-area-inset-top,0px) + 56px);width:38%;display:flex;flex-direction:column;gap:8px}
.mright{right:12px;top:calc(env(safe-area-inset-top,0px) + 56px);width:32%}
.hs{display:flex;gap:10px;align-items:center;background:rgba(45,45,80,.65);border:2px solid #8a8fff;border-radius:13px;padding:4px;font-size:11px;font-weight:800}
.hs b{display:block;font-size:17px}.hs small{opacity:.8}
.av{width:38px;height:38px;border-radius:10px;border:2px solid #fff;background:#334 url(tex/face_s.jpg) center/cover}
.tile{position:relative;width:100%;min-height:50px;border-radius:13px;border:2px solid #fff;padding:6px 8px;text-align:left;font-size:12px;line-height:1.05;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.35);font-style:italic}
.tile i{position:absolute;right:6px;bottom:2px;font-size:24px;font-style:normal}.tile small{display:block;font-size:10px;font-weight:700;margin-top:4px}
.tile.gold{background:linear-gradient(#ffd23a,#f29a00);color:#4a2600;min-height:60px}.tile.grn{background:linear-gradient(#35d172,#12843f)}
.tap{left:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 130px);background:none;box-shadow:none;padding:0;font-size:30px;font-style:italic;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.45),0 0 12px rgba(0,0,0,.4);transform:rotate(-4deg);animation:pulse 1.4s infinite}
@keyframes pulse{50%{transform:rotate(-4deg) scale(1.06)}}
.mbot{left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:8px}
.nb{position:relative;flex:1;height:84px;padding:6px 2px 0;border-radius:14px;background:linear-gradient(#3a8be8,#1f5fc4);border:3px solid #cfe3ff;box-shadow:0 5px 0 #123c82;font-size:11px;font-style:italic;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.nb i{font-size:28px;font-style:normal}
.bd{position:absolute;top:-12px;right:-6px;background:#e8383d;border:3px solid #fff;border-radius:50%;min-width:28px;height:28px;font-size:15px;display:flex;align-items:center;justify-content:center;font-style:normal}

#over,#panel{justify-content:center;background:rgba(8,10,30,.8);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding-top:24px}
.hidden{display:none!important}
.logo{font-size:60px;font-weight:900;line-height:.9;letter-spacing:-2px;color:var(--gold);text-shadow:0 4px 0 #b86e00,0 8px 18px rgba(0,0,0,.5);transform:rotate(-3deg)}
.logo em{display:block;font-style:normal;font-size:24px;letter-spacing:0;color:#fff;text-shadow:0 3px 0 #d83a3a;margin-top:6px}
.bal{font-weight:800;font-size:16px;background:rgba(0,0,0,.35);border-radius:14px;padding:6px 14px}
.row{display:flex;gap:10px;width:100%;max-width:340px}.row button{flex:1;padding:11px 8px;font-size:15px}button.ses{background:linear-gradient(#ff5a5a,#c4202a);box-shadow:0 5px 0 #7a0f16}.chip{display:inline-flex;align-items:center;gap:4px}
.card{background:#1b2350;border:3px solid #3b4a9a;border-radius:22px;padding:20px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px;font-size:15px;line-height:1.4}
.card h2{margin:0;font-size:26px}.card p{margin:0}.b{font-size:22px;font-weight:900}
h1{margin:0;font-size:42px}.stat{font-size:18px;font-weight:800}
button{appearance:none;border:0;border-radius:16px;padding:14px 22px;font-size:17px;font-weight:900;color:#fff;background:#3b6df0;box-shadow:0 5px 0 #1e3f9c}
button.big{font-size:26px;padding:18px 54px;background:linear-gradient(#ffb21e,#ff7a00);color:#3a1d00;box-shadow:0 7px 0 #b34a00;margin:6px 0}
button:active{transform:translateY(4px);box-shadow:0 1px 0 #1e3f9c}
</style></head><body>
<canvas id="gl"></canvas><canvas id="c"></canvas>
<div class="hud hidden" id="hud"><div><span id="sc">0</span> м<small>рекорд <span id="bs">0</span></small><small id="lv">❤️❤️</small></div><div class="r">📘 <span id="cd">0</span><small>зачётки</small></div></div>
<div id="bons"></div><div id="mpbar" class="hidden"></div><button id="bSnd" class="hidden">🔊</button>
<div class="screen" id="menu">
<div class="mtop"><div class="cur">📘 <b id="mC">0</b></div><button class="gear" data-p="set">⚙️</button></div>
<div class="gtitle">ПОБЕГ<em>от Мательского</em></div>
<div class="mleft"><div class="hs"><div class="av"></div><div><small>Рекорд</small><b><span id="mB">0</span> м</b></div></div>
<button class="tile grn" data-p="mp"><span>МУЛЬТИ-<br>ПЛЕЕР</span><i>👥</i></button></div>
<div class="mright"><button class="tile gold" id="bSes"><span>СЕССИЯ</span><small>×2 зачётки</small><i>🔥</i></button></div>
<button class="tap" id="bPlay">Нажми, чтобы играть</button>
<div class="mbot"><button class="nb" data-p="q"><i>📋</i>ЗАДАНИЯ<b class="bd" id="qb">0</b></button><button class="nb" data-p="ach"><i>🏅</i>НАГРАДЫ</button><button class="nb" data-p="shop"><i>🛒</i>МАГАЗИН</button><button class="nb" data-p="top"><i>🏆</i>ЛИДЕРЫ</button></div>
</div>
<div class="screen hidden" id="panel"><div class="card"><h2 id="pT"></h2><div id="pB" style="display:flex;flex-direction:column;gap:10px"></div><button id="pX">Назад</button></div></div>
<div class="screen hidden" id="over"><h1 id="oH">Догнал!</h1>
<div class="stat"><span id="oS">0</span> м · 📘 <span id="oC">0</span> за забег</div>
<div class="stat">Всего зачёток: <span id="oT">0</span></div><div class="stat" id="oB"></div>
<button class="big" id="bAgain">Ещё раз</button><button id="bMenu">В меню</button></div>

function rig(p,map,col){if(!window.BM){window.BM=[0,1,2,3,4,5].map(()=>LM({color:0x9a9ca2}));const R6=[[0,0,256,256],[256,0,256,256],[512,0,128,360],[640,0,128,360],[768,0,128,360],[896,0,128,360]];ld.load('tex/body.jpg',t=>{const im=t.image;BM.forEach((m,i)=>{const r=R6[i],c=document.createElement('canvas');c.width=r[2];c.height=r[3];c.getContext('2d').drawImage(im,r[0],r[1],r[2],r[3],0,0,r[2],r[3]);m.map=new T.CanvasTexture(c);m.color.setHex(0xffffff);m.needsUpdate=true})})}const hm=LM({color:col||0xd9b28c});if(map)ld.load('tex/'+map,t=>{hm.map=t;hm.color.setHex(0xffffff);hm.needsUpdate=true});const g=new T.Group(),R={g},top=p?fab:M(0x6f7580),pants=p?den:M(0x4a4f58),shoe=M(p?0x6b705f:0x1e1e22),skin=M(0xf1c7a0),body=new T.Group();g.add(body);R.body=body;
R.legs=[-1,1].map(s=>{const l=new T.Group();l.position.set(s*.13,.68,0);Bx(l,.19,.62,.18,p?[M(0x86a9d4),M(0x86a9d4),M(0x86a9d4),M(0x86a9d4),BM[s>0?5:4],BM[s>0?3:2]]:pants,0,-.62,0);Bx(l,.21,.1,.32,shoe,0,-.7,-.05);body.add(l);return l});
Bx(body,.54,.5,.3,p?[M(0x9a9ca2),M(0x9a9ca2),M(0x9a9ca2),M(0x9a9ca2),BM[1],BM[0]]:top,0,.66,0);if(!p){Bx(body,.08,.32,.02,0x4a4f8a,0,.72,-.16);Bx(body,.3,.06,.3,0xffffff,0,1.12,0)}
R.arms=[-1,1].map(s=>{const a=new T.Group();a.position.set(s*.34,1.12,0);Bx(a,.14,.52,.15,top,0,-.5,0);Sp(a,.075,skin,0,-.56,0);body.add(a);return a});
Cy(body,.07,.12,skin,0,1.12,0);const h=new T.Mesh(gs(.21),hm);h.scale.set(1,1.12,1.05);h.position.set(0,1.34,0);body.add(h);sc.add(g);return R}
function pose(R,ph,mode,T2){const sw=Math.sin(ph);if(mode==='s'){R.body.rotation.x=-.45;R.body.scale.y=.55;R.body.position.y=0;R.legs.forEach(l=>l.rotation.x=.6);R.arms.forEach(a=>a.rotation.x=-.9)}else{R.body.scale.y=1;R.body.rotation.x=0;R.body.position.y=Math.abs(sw)*.06;const A=mode==='j'?.3:.85;R.legs[0].rotation.x=sw*A;R.legs[1].rotation.x=-sw*A;R.arms[0].rotation.x=-sw*A;R.arms[1].rotation.x=T2?2.5+Math.sin(ph*.5)*.15:sw*A}}
const plr=rig(true,'head_s.jpg'),tch=rig(false,'head_t.jpg');tch.g.scale.set(1.08,1.08,1.08);
const objRoot=new T.Group();sc.add(objRoot);let chW=0,locS=-1;const gr={};
const TINT=[[0xffffff,0xffffff,0x0b0f24],[0xffd2a0,0xf4e6c8,0x1a0f1c],[0xb8e6c8,0xe0a860,0x08201c]];
GLR.resize=()=>{rd.setSize(innerWidth,innerHeight,false);const a=innerWidth/innerHeight;cam.aspect=a;cam.fov=Math.min(86,Math.max(58,2*Math.atan(Math.tan(22*Math.PI/180)/a)*180/Math.PI));cam.updateProjectionMatrix()};GLR.resize();
GLR.labels=[];
GLR.render=()=>{
if(locS!==loc){locS=loc;const c=TINT[loc];wallM.color.setHex(c[0]);floorM.color.setHex(c[1]);sc.background.setHex(c[2]);sc.fog.color.setHex(c[2])}
const base=Math.floor(dist/SEG),off=dist-base*SEG;
segs.forEach((g,k)=>{const idx=base+k-1;g.position.z=(1-k)*SEG+off;if(g.idx!==idx){g.idx=idx;const d=g.userData;for(const s of[-1,1]){const kd=(((idx+(s>0?2:0))%4)+4)%4;d[s].door.visible=kd===0;d[s].win.visible=d[s].rad.visible=kd===2;d[s].cab.visible=kd===3}d.lamp.visible=d.pool.visible=(((idx%2)+2)%2)===0}});
glf++;
for(const o of objs){if(!o.m){o.m=mk(o);objRoot.add(o.m)}const m=o.m,z=-(o.w-dist);m.position.set(o.lane,0,z);m.userData.seen=glf;
if(o.type==='card'){m.rotation.y=time*3+o.w;m.position.y=Math.sin(time*5+o.w)*.04}else if(o.type==='bonus'){const p=1+Math.sin(time*6)*.08;m.scale.set(p,p,p)}else if(m.userData.tick)m.userData.tick(time)}
for(let i=objRoot.children.length-1;i>=0;i--)if(objRoot.children[i].userData.seen!==glf)objRoot.remove(objRoot.children[i]);
const jh=jumpT>=0?Math.sin(Math.PI*jumpT/JD):0;
const mn=st==='menu';plr.g.position.set(laneX,jh*1.3,0);plr.g.rotation.y=mn?Math.PI:0;tch.g.visible=!mn;pose(plr,mn?time*4:time*14,slideT>=0?'s':jumpT>=0?'j':'r');
chW+=(laneX-chW)*Math.min(1,gdt*5);tch.g.position.set(chW,0,2-cd*.5);pose(tch,time*9,'r',1);
GLR.labels=[];const seen={};
if(mpOn)for(const id in ghosts){if(id===myId)continue;const q=ghosts[id],z=-(q.d-dist);if(z>2.5||z<-50)continue;seen[id]=1;let r=gr[id];if(!r){const c=new T.Color().setHSL((id.split('').reduce((a,b)=>a+b.charCodeAt(0),0)*47%360)/360,.7,.55);r=gr[id]=rig(true,null,c.getHex())}r.g.visible=true;r.g.position.set(q.l,(q.j||0)*1.3,z);pose(r,time*14,q.j?'j':'r');GLR.labels.push({n:names[id]||'?',x:q.l,y:1.9,z})}
for(const id in gr)if(!seen[id])gr[id].g.visible=false;
const sh=shake>0?.2:0;cam.position.set(laneX*.55+(Math.random()-.5)*sh,3.5+(Math.random()-.5)*sh,5);if(mn){cam.position.set(.35,1.45,2.7);cam.lookAt(0,1.4,0)}else cam.lookAt(laneX*.3,1.1,-6);
rd.render(sc,cam);
GLR.labels.forEach(l=>{const v=new T.Vector3(l.x,l.y,l.z).project(cam);l.sx=(v.x+1)/2*W;l.sy=(1-v.y)/2*H})};
GLok=1}catch(e){GLok=0;console.log('3D off',e)}}
function overlay(){ctx.clearRect(0,0,W,H);
if(bon.dash>0){ctx.fillStyle='rgba(255,230,120,.12)';ctx.fillRect(0,0,W,H)}
if(flash>0){ctx.fillStyle='rgba(255,60,60,'+flash*1.2+')';ctx.fillRect(0,0,W,H)}
GLR.labels.forEach(l=>txt(l.n,l.sx,l.sy,14,'#fff'));
if(toast>0){ctx.globalAlpha=Math.min(1,toast*2);ctx.lineWidth=6;ctx.strokeStyle='#000';ctx.font='900 30px -apple-system,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.strokeText(toastT,W/2,H*.27);ctx.fillStyle='#ffd23f';ctx.fillText(toastT,W/2,H*.27);ctx.globalAlpha=1}}
function draw(){if(GLok){GLR.render();overlay()}else draw2d()}

// ---- цикл ----
let last=performance.now(),sv=0;
function loop(ts){requestAnimationFrame(loop);const dt=Math.min((ts-last)/1000,.05);last=ts;gdt=dt;time+=dt;
cd+=(close-cd)*Math.min(1,dt*3);if(st==='play')update(dt);
if(dirty&&(sv+=dt)>2.5){save();dirty=0;sv=0}
draw()}
initGL();ui();setUI();requestAnimationFrame(loop);
})();
</script></body></html>
